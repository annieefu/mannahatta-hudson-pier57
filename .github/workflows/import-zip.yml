name: Import storymap zip

on:
  push:
    branches: [main, master]
    paths:
      - storymap-export.zip
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-storymap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Require export zip
        run: |
          if [ ! -f storymap-export.zip ]; then
            echo "No storymap-export.zip found. Upload the Storymap Engine export zip with that exact name."
            exit 1
          fi

      - name: Unpack export
        run: |
          chmod +x scripts/import-export.sh
          ./scripts/import-export.sh storymap-export.zip

      - name: Commit unpacked site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes after import."
            exit 0
          fi
          git commit -m "Import storymap from storymap-export.zip"
          git push
